<title>Today's List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  /* Layout: one centred working column — header, progress panel, list tabs, then the task card */
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --surface-2: #f6f8fa;
    --fg: #17202b;
    --muted: #6b7684;
    --line: #dde3ea;
    --accent: #1f6f5c;
    --accent-soft: #e2f0eb;
    --on-accent: #ffffff;
    --danger: #c2412d;
    --danger-soft: #fbe9e5;
    --warn: #b7791f;
    --warn-soft: #fbf1dc;
    --shadow: 0 1px 2px rgba(23,32,43,.04), 0 8px 24px rgba(23,32,43,.06);
    --c0: #1f6f5c; --c1: #3b62c4; --c2: #b5476b; --c3: #c47a1f; --c4: #7552b8; --c5: #2b8a9e;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151b; --surface: #19212a; --surface-2: #1e2731; --fg: #e8edf2; --muted: #8b97a5;
      --line: #2a343f; --accent: #5cc5a6; --accent-soft: #1b3530; --on-accent: #0d1f1a;
      --danger: #f07a66; --danger-soft: #3a211d; --warn: #e8b04f; --warn-soft: #362c18;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      --c0: #5cc5a6; --c1: #7d9cf0; --c2: #e57fa1; --c3: #e8a456; --c4: #a98bea; --c5: #5cc0d4;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10151b; --surface: #19212a; --surface-2: #1e2731; --fg: #e8edf2; --muted: #8b97a5;
    --line: #2a343f; --accent: #5cc5a6; --accent-soft: #1b3530; --on-accent: #0d1f1a;
    --danger: #f07a66; --danger-soft: #3a211d; --warn: #e8b04f; --warn-soft: #362c18;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --c0: #5cc5a6; --c1: #7d9cf0; --c2: #e57fa1; --c3: #e8a456; --c4: #a98bea; --c5: #5cc0d4;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 16px; line-height: 1.5;
    padding-inline: 16px; padding-block: 40px 96px;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 680px; margin: 0 auto; display: grid; gap: 20px; }
  svg { display: block; }

  /* Header */
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; }
  .eyebrow { font-size: .8rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 6vw, 2.75rem); letter-spacing: -0.03em; line-height: 1.05; margin: 4px 0 0; text-wrap: balance; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .faces { display: flex; align-items: center; }
  .faces .face { margin-left: -8px; }
  .faces .face:first-child { margin-left: 0; }
  .face { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--bg); background: var(--line); object-fit: cover; flex: none; display: grid; place-content: center; font-size: .7rem; font-weight: 700; color: var(--muted); }
  .face.me { box-shadow: 0 0 0 2px var(--accent); }
  .status { display: inline-flex; align-items: center; gap: 7px; font-size: .8rem; font-weight: 600; color: var(--muted); background: var(--surface); border: 1px solid var(--line); padding: 5px 11px 5px 9px; border-radius: 999px; white-space: nowrap; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.live .dot { background: var(--accent); box-shadow: 0 0 0 0 var(--accent); animation: pulse 2.4s infinite; }
  .status.warn .dot { background: var(--warn); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

  /* Progress panel */
  .panel { display: grid; grid-template-columns: auto 1fr; gap: 16px 20px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; box-shadow: var(--shadow); }
  .ring { position: relative; width: 84px; height: 84px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .track { stroke: var(--line); }
  .ring .bar { stroke: var(--accent); transition: stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1); }
  .ring .num { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .num b { font-family: var(--font-display); font-size: 1.35rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .ring .num span { font-size: .68rem; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .summary { min-width: 0; display: grid; gap: 10px; }
  .summary-line { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; letter-spacing: -0.01em; line-height: 1.25; text-wrap: balance; }
  .summary-line .od { color: var(--danger); }
  .summary-line .td { color: var(--warn); }
  .filters { display: flex; gap: 4px; flex-wrap: wrap; background: var(--surface-2); border: 1px solid var(--line); padding: 3px; border-radius: 11px; width: fit-content; max-width: 100%; }
  .filters button { border: 0; background: transparent; padding: 5px 11px; border-radius: 8px; font-size: .875rem; font-weight: 600; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .filters button:hover { color: var(--fg); }
  .filters button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .filters .n { font-size: .75rem; font-variant-numeric: tabular-nums; color: var(--muted); }
  .filters .n.hot { color: var(--danger); }

  /* List tabs */
  .tabs-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; padding: 2px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { position: relative; display: inline-flex; align-items: center; gap: 8px; flex: none; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 999px; font-size: .9rem; font-weight: 600; cursor: pointer; color: var(--fg); white-space: nowrap; }
  .tab:hover { border-color: color-mix(in srgb, var(--pc, var(--accent)) 50%, var(--line)); }
  .tab[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .tab .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--pc, var(--muted)); }
  .tab .cnt { font-size: .75rem; opacity: .65; font-variant-numeric: tabular-nums; }
  .tab .here { display: flex; }
  .tab .here i { width: 7px; height: 7px; border-radius: 50%; margin-left: -2px; border: 1.5px solid var(--surface); }
  .tab[aria-pressed="true"] .here i { border-color: var(--fg); }
  .tab .more { display: grid; place-content: center; width: 20px; height: 20px; margin-right: -6px; border-radius: 50%; opacity: .7; }
  .tab .more:hover { opacity: 1; background: color-mix(in srgb, var(--bg) 20%, transparent); }
  .ghost-btn { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px dashed var(--line); background: transparent; color: var(--muted); padding: 7px 12px; border-radius: 999px; font-size: .9rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .ghost-btn:hover { color: var(--accent); border-color: var(--accent); }
  .new-list { flex: none; width: 160px; font: inherit; font-size: .9rem; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--accent); background: var(--surface); color: var(--fg); outline: none; }

  .popover { position: fixed; z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; min-width: 200px; max-width: calc(100vw - 32px); display: grid; gap: 2px; }
  .popover button.item { border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: .9rem; display: flex; align-items: center; gap: 8px; }
  .popover button.item:hover { background: var(--surface-2); }
  .popover button.item.danger { color: var(--danger); }
  .popover .confirm { padding: 8px 10px; font-size: .875rem; color: var(--muted); display: grid; gap: 10px; }
  .popover .row { display: flex; gap: 8px; }
  .popover input { font: inherit; font-size: .9rem; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); width: 100%; }
  .popover .swatches { display: flex; gap: 6px; padding: 6px 10px 8px; }
  .popover .swatches button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; background: var(--pc); cursor: pointer; }
  .popover .swatches button[aria-pressed="true"] { border-color: var(--fg); }
  .btn { border: 0; border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: .85rem; cursor: pointer; }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.danger { background: var(--danger); color: var(--surface); }
  .btn.plain { background: var(--surface-2); }

  /* Task card */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  form.add { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .add-top { display: flex; gap: 8px; align-items: center; }
  .add-top .plus { width: 22px; height: 22px; border-radius: 50%; border: 2px dashed var(--line); flex: none; margin-left: 6px; }
  #new-task { flex: 1; min-width: 0; font: inherit; font-size: 1.02rem; color: var(--fg); background: transparent; border: 0; padding: 8px 4px; outline: none; }
  #new-task::placeholder { color: var(--muted); }
  .add-btn { font-weight: 700; color: var(--on-accent); background: var(--accent); border: 0; border-radius: 10px; padding: 8px 16px; cursor: pointer; flex: none; }
  .add-btn:disabled { opacity: .4; cursor: default; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-left: 36px; }
  .chip { position: relative; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); border-radius: 8px; padding: 3px 9px; font-size: .8rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .chip:hover { color: var(--fg); }
  .chip.set { color: var(--fg); background: var(--surface); }
  .chip.high { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); background: var(--danger-soft); }
  .chip.low { color: var(--muted); }
  .chip.parsed { animation: pop .25s ease; }
  @keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }
  .chip select { position: absolute; inset: 0; opacity: 0; cursor: pointer; font: inherit; }
  .chip .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--pc, var(--muted)); }
  .date-proxy { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; bottom: 0; left: 0; border: 0; padding: 0; }
  .hint { font-size: .78rem; color: var(--muted); margin-left: auto; }
  .hint code { font-family: inherit; font-weight: 700; color: var(--fg); background: var(--surface-2); padding: 0 4px; border-radius: 4px; }

  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: .8rem; color: var(--muted); }
  .sort { display: flex; gap: 2px; }
  .sort button { border: 0; background: transparent; padding: 3px 9px; border-radius: 6px; font-size: .8rem; font-weight: 600; color: var(--muted); cursor: pointer; }
  .sort button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }

  ul.tasks { list-style: none; margin: 0; padding: 0; }
  li.task { position: relative; display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); transition: background .3s; }
  li.task:last-child { border-bottom: 0; }
  li.task.prio-high::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--danger); }
  li.task.flash { animation: flash 1.6s ease; }
  @keyframes flash { 0%, 30% { background: var(--accent-soft); } 100% { background: var(--surface); } }
  li.task.sortable-ghost { opacity: .35; }
  li.task.sortable-chosen { box-shadow: var(--shadow); }
  .grip { flex: none; width: 18px; height: 26px; display: grid; place-content: center; color: var(--muted); cursor: grab; opacity: .5; margin-left: -6px; touch-action: none; }
  .grip:hover { opacity: 1; }

  .check { flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--line); background: transparent; cursor: pointer; display: grid; place-content: center; padding: 0; transition: border-color .15s, background .2s, transform .15s; }
  .check:hover { border-color: var(--accent); }
  .check:active { transform: scale(.88); }
  .check svg path { stroke: var(--on-accent); stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset .25s ease .05s; }
  .prio-high .check { border-color: color-mix(in srgb, var(--danger) 55%, var(--line)); }
  .done .check, .completing .check { background: var(--accent); border-color: var(--accent); }
  .done .check svg path, .completing .check svg path { stroke-dashoffset: 0; }
  .check:disabled { cursor: default; }

  .body { flex: 1; min-width: 0; display: grid; gap: 4px; }
  .text { overflow-wrap: anywhere; cursor: text; padding-top: 1px; }
  .text span { background: linear-gradient(currentColor, currentColor) 0 58% / 0 1.5px no-repeat; transition: background-size .35s ease, color .3s; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .done .text span, .completing .text span { background-size: 100% 1.5px; color: var(--muted); }
  .prio-low .text { color: var(--muted); }
  .edit-input { font: inherit; width: 100%; color: var(--fg); background: var(--surface-2); border: 1px solid var(--accent); border-radius: 8px; padding: 3px 8px; outline: none; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .78rem; color: var(--muted); }
  .meta:empty { display: none; }
  .tag { position: relative; display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; padding: 1px 7px; font-weight: 600; border: 1px solid transparent; background: var(--surface-2); color: var(--muted); }
  button.tag { cursor: pointer; }
  button.tag:hover { border-color: var(--line); }
  .tag.overdue { background: var(--danger-soft); color: var(--danger); }
  .tag.today { background: var(--warn-soft); color: var(--warn); }
  .tag.soon { color: var(--fg); }
  .tag.proj .sw { width: 7px; height: 7px; border-radius: 50%; background: var(--pc); }
  .tag.ghost { opacity: 0; transition: opacity .15s; background: transparent; border: 1px dashed var(--line); }
  li.task:hover .tag.ghost, .tag.ghost:focus-visible { opacity: 1; }
  @media (hover: none) { .tag.ghost { opacity: .7; } }
  .who { display: inline-flex; align-items: center; gap: 5px; }
  .who img, .who .face { width: 16px; height: 16px; border: 0; border-radius: 50%; font-size: .5rem; }

  .actions { display: flex; gap: 2px; flex: none; margin-top: -2px; }
  .icon-btn { width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-content: center; opacity: .35; transition: opacity .15s, color .15s, background .15s; }
  li.task:hover .icon-btn, .icon-btn:focus-visible { opacity: 1; }
  @media (hover: none) { .icon-btn { opacity: .7; } }
  .icon-btn:hover { background: var(--surface-2); color: var(--fg); }
  .icon-btn.flag.on { color: var(--danger); opacity: 1; }
  .icon-btn.del:hover { color: var(--danger); background: var(--danger-soft); }

  .done-head { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; border-top: 1px solid var(--line); background: var(--surface-2); padding: 10px 16px; font-size: .8rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); cursor: pointer; text-align: left; }
  .done-head svg { transition: transform .2s; }
  .done-head[aria-expanded="false"] svg { transform: rotate(-90deg); }
  .done-head .clear { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600; }
  .done-head .clear:hover { color: var(--danger); }
  ul.tasks.done-list li.task { background: var(--surface-2); }

  .empty { padding: 44px 20px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
  .empty b { font-family: var(--font-display); font-size: 1.15rem; color: var(--fg); }
  .empty .art { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-content: center; margin-bottom: 6px; }
  .skeleton { padding: 16px; display: grid; gap: 14px; }
  .skeleton i { display: block; height: 14px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); color: var(--fg); padding: 12px 14px; border-radius: 14px; font-size: .9rem; }
  .banner > span { flex: 1; min-width: 200px; }

  footer { display: flex; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
  kbd { font-family: inherit; font-size: .75rem; font-weight: 700; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; background: var(--surface); }

  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 30; display: flex; align-items: center; gap: 14px; background: var(--fg); color: var(--bg); padding: 10px 10px 10px 16px; border-radius: 12px; font-size: .9rem; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.25); transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { border: 0; background: color-mix(in srgb, var(--bg) 18%, transparent); color: var(--bg); font-weight: 700; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
  .toast button[hidden] { display: none; }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }

  @media (max-width: 520px) {
    .panel { grid-template-columns: 1fr; justify-items: start; }
    .panel .ring { display: none; }
    .hint { display: none; }
    .chips { padding-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>

<canvas id="fx" aria-hidden="true"></canvas>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow" id="today-label"></div>
      <h1>Today's List</h1>
    </div>
    <div class="header-right">
      <div class="faces" id="faces"></div>
      <span class="status" id="status"><i class="dot"></i><span>Loading</span></span>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section class="panel" aria-label="Progress">
    <div class="ring" aria-hidden="true">
      <svg width="84" height="84" viewBox="0 0 84 84"><circle class="track" cx="42" cy="42" r="36" fill="none" stroke-width="8"/><circle class="bar" id="ring-bar" cx="42" cy="42" r="36" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="226.2" stroke-dashoffset="226.2"/></svg>
      <div class="num"><b id="ring-num">0%</b><span>done</span></div>
    </div>
    <div class="summary">
      <div class="summary-line" id="summary-line">Loading your tasks</div>
      <div class="filters" id="filters" role="group" aria-label="Show"></div>
    </div>
  </section>

  <div class="tabs-row">
    <div class="tabs" id="tabs" role="group" aria-label="Lists"></div>
    <button class="ghost-btn" id="new-list-btn" type="button">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>New list
    </button>
    <input class="new-list" id="new-list-input" placeholder="List name" maxlength="40" hidden>
  </div>

  <div class="card">
    <form class="add" id="add-form" autocomplete="off">
      <div class="add-top">
        <span class="plus" aria-hidden="true"></span>
        <label for="new-task" hidden>New task</label>
        <input id="new-task" type="text" placeholder="Add a task…" maxlength="200">
        <button class="add-btn" id="add-btn" type="submit" disabled>Add</button>
      </div>
      <div class="chips">
        <button type="button" class="chip" id="chip-date">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 7h12M5 1.5v3M11 1.5v3"/></svg>
          <span>No date</span>
          <input type="date" class="date-proxy" id="date-input" tabindex="-1" aria-label="Due date">
        </button>
        <button type="button" class="chip" id="chip-prio">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 14V2.5M3.5 3h8l-2 3 2 3h-8"/></svg>
          <span>Normal</span>
        </button>
        <label class="chip" id="chip-list">
          <i class="sw"></i><span>No list</span>
          <select id="list-select" aria-label="List"></select>
        </label>
        <span class="hint">Try <code>tomorrow</code> <code>!high</code> <code>#list</code></span>
      </div>
    </form>
    <div class="toolbar">
      <span id="toolbar-count"></span>
      <div class="sort" role="group" aria-label="Sort">
        <button type="button" data-sort="smart">Smart order</button>
        <button type="button" data-sort="manual">My order</button>
      </div>
    </div>
    <div id="list-area">
      <div class="skeleton"><i style="width:70%"></i><i style="width:55%"></i><i style="width:80%"></i></div>
    </div>
  </div>

  <footer>
    <span id="foot-note"></span>
    <span>Press <kbd>/</kbd> to add · double-click a task to edit</span>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="toast-btn" hidden>Undo</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
(() => {
  /* ---------- helpers ---------- */
  const $ = s => document.querySelector(s);
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "svg") el.innerHTML = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
    return el;
  }
  const ICON = {
    check: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2l2.3 2.3 4.7-5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    x: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
    flag: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 14V2.5M3.5 3h8l-2 3 2 3h-8"/></svg>',
    cal: '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 7h12"/></svg>',
    grip: '<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="3" cy="3" r="1.4"/><circle cx="7" cy="3" r="1.4"/><circle cx="3" cy="8" r="1.4"/><circle cx="7" cy="8" r="1.4"/><circle cx="3" cy="13" r="1.4"/><circle cx="7" cy="13" r="1.4"/></svg>',
    more: '<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.6"/><circle cx="8" cy="8" r="1.6"/><circle cx="13" cy="8" r="1.6"/></svg>',
    chev: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>',
    sun: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  /* ---------- dates (local calendar days as YYYY-MM-DD) ---------- */
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const noon = () => { const d = new Date(); d.setHours(12, 0, 0, 0); return d; };
  const addDays = n => { const d = noon(); d.setDate(d.getDate() + n); return ymd(d); };
  const parseYmd = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
  const daysFromToday = s => Math.round((parseYmd(s) - noon()) / 864e5);
  function dueInfo(s) {
    const n = daysFromToday(s);
    if (n < -1) return { text: `${-n} days overdue`, cls: "overdue" };
    if (n === -1) return { text: "Due yesterday", cls: "overdue" };
    if (n === 0) return { text: "Today", cls: "today" };
    if (n === 1) return { text: "Tomorrow", cls: "soon" };
    if (n < 7) return { text: parseYmd(s).toLocaleDateString("en-AU", { weekday: "long" }), cls: "soon" };
    return { text: parseYmd(s).toLocaleDateString("en-AU", { day: "numeric", month: "short" }), cls: "" };
  }

  /* ---------- state ---------- */
  const S = {
    mode: "loading",           // loading | local | cloud
    tasks: new Map(), projects: new Map(),
    me: null, readOnly: false, canWriteKnown: false,
    status: "loading", pending: false,
    peers: [], profiles: new Map(),
    flash: new Set(), mine: new Set(),
    editing: null, dragging: false, completing: new Set(),
    confirmed: false,
  };
  const ui = Object.assign({ filter: "all", project: "all", sort: "smart", showDone: true }, store.get("todo-ui-v2") || {});
  const saveUI = () => store.set("todo-ui-v2", ui);
  let db = null, user = null, room = null;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- data layer: one API, local or shared ---------- */
  const LOCAL_KEY = "todo-list-v2";
  function persistLocal() {
    store.set(LOCAL_KEY, { tasks: [...S.tasks.values()], projects: [...S.projects.values()] });
  }
  const chains = new Map();
  function queue(path, fn) {
    const prev = chains.get(path) || Promise.resolve();
    const p = prev.catch(() => {}).then(fn);
    chains.set(path, p);
    p.catch(writeFailed).finally(() => { if (chains.get(path) === p) chains.delete(path); });
    return p;
  }
  function writeFailed(e) {
    const code = e && e.code;
    if (code === "invalid_argument" && !S.canWriteKnown) { S.readOnly = true; render(); toast("You can view this list but not change it."); }
    else if (code === "quota_exceeded") toast("The list is full. Clear some completed tasks and try again.");
    else toast("That change didn't save. Check your connection and try again.");
  }
  function markMine(id) { S.mine.add(id); setTimeout(() => S.mine.delete(id), 4000); }
  function write(col, id, op, data) {
    const map = col === "tasks" ? S.tasks : S.projects;
    if (S.mode === "local") {
      if (op === "delete") map.delete(id);
      else if (op === "set") map.set(id, { ...data, id });
      else map.set(id, { ...map.get(id), ...data, id });
      persistLocal(); render();
      return Promise.resolve();
    }
    markMine(id);
    const ref = db.doc(col + "/" + id);
    const clean = data ? Object.fromEntries(Object.entries(data).filter(([k]) => k !== "id")) : null;
    return queue(col + "/" + id, () => op === "delete" ? ref.delete() : op === "set" ? ref.set(clean) : ref.update(clean));
  }
  const api = {
    addTask: d => { const id = newId(); return write("tasks", id, "set", d).then(() => id); },
    updateTask: (id, d) => write("tasks", id, "update", d),
    removeTask: id => write("tasks", id, "delete"),
    restoreTask: (id, d) => write("tasks", id, "set", d),
    addProject: d => { const id = newId(); write("projects", id, "set", d); return id; },
    updateProject: (id, d) => write("projects", id, "update", d),
    removeProject: id => write("projects", id, "delete"),
  };

  /* ---------- local mode ---------- */
  function exampleData() {
    const p1 = "ex-office", p2 = "ex-site", now = Date.now();
    return {
      projects: [
        { id: p1, name: "Office admin", color: 0, order: 0, createdAt: now },
        { id: p2, name: "Site work", color: 1, order: 1, createdAt: now },
      ],
      tasks: [
        { id: "ex1", text: "Example: Send invoice for last month's work", done: false, projectId: p1, due: addDays(-1), priority: "high", order: 0, createdAt: now },
        { id: "ex2", text: "Example: Reply to supplier quote", done: false, projectId: p1, due: addDays(0), priority: "normal", order: 1, createdAt: now },
        { id: "ex3", text: "Example: Book site inspection", done: false, projectId: p2, due: addDays(3), priority: "normal", order: 2, createdAt: now },
        { id: "ex4", text: "Example: Order sealant samples", done: false, projectId: p2, due: null, priority: "low", order: 3, createdAt: now },
        { id: "ex5", text: "Example: Update insurance certificate", done: true, projectId: p1, due: null, priority: "normal", order: 4, createdAt: now, doneAt: now },
      ],
    };
  }
  function oldTasks() {
    const v1 = store.get("todo-list-v1");
    return Array.isArray(v1) ? v1.filter(t => t && typeof t.text === "string") : [];
  }
  function startLocal() {
    S.mode = "local"; S.status = "local"; S.confirmed = true;
    let data = store.get(LOCAL_KEY);
    if (!data || !Array.isArray(data.tasks)) {
      const v1 = oldTasks();
      if (v1.length) data = { projects: [], tasks: v1.map((t, i) => ({ id: "v1-" + i, text: t.text, done: !!t.done, projectId: null, due: null, priority: "normal", order: i, createdAt: Date.now() })) };
      else data = exampleData();
      store.set(LOCAL_KEY, data);
    }
    data.tasks.forEach(t => S.tasks.set(t.id, t));
    (data.projects || []).forEach(p => S.projects.set(p.id, p));
    render();
  }

  /* ---------- shared mode ---------- */
  async function startCloud() {
    S.mode = "cloud"; S.status = "connecting";
    S.me = user ? await user.id() : null;
    const can = user ? await user.can("data.write") : null;
    if (can === false) S.readOnly = true;
    S.canWriteKnown = can !== null;
    render();
    let tasksOk = false, projOk = false, firstTasks = true;
    const slow = setTimeout(() => { if (!S.confirmed) { S.status = "slow"; render(); } }, 10000);
    const settle = () => { if (tasksOk && projOk && !S.confirmed) { S.confirmed = true; clearTimeout(slow); S.status = "live"; checkImport(); } };
    const fail = () => { clearTimeout(slow); S.status = "error"; render(); };
    db.collection("tasks").onSnapshot(snap => {
      if (!firstTasks) {
        for (const ch of snap.docChanges()) {
          if (ch.type === "removed" || S.mine.has(ch.doc.id) || ch.doc.metadata.hasPendingWrites) continue;
          S.flash.add(ch.doc.id); setTimeout(() => { S.flash.delete(ch.doc.id); }, 1700);
        }
      }
      firstTasks = false;
      S.tasks = new Map(snap.docs.map(d => [d.id, { ...d.data(), id: d.id }]));
      S.pending = snap.metadata.hasPendingWrites;
      if (!snap.metadata.fromCache) tasksOk = true;
      settle(); render();
    }, fail);
    db.collection("projects").onSnapshot(snap => {
      S.projects = new Map(snap.docs.map(d => [d.id, { ...d.data(), id: d.id }]));
      if (!snap.metadata.fromCache) projOk = true;
      settle(); render();
    }, fail);
  }

  function checkImport() {
    if (S.readOnly || store.get("todo-imported")) return;
    const local = store.get(LOCAL_KEY);
    let mine = (local && Array.isArray(local.tasks) ? local.tasks : oldTasks()).filter(t => !/^Example:/i.test(t.text || ""));
    if (!mine.length) return;
    const b = $("#banner");
    b.replaceChildren(
      h("span", null, `You have ${mine.length} task${mine.length > 1 ? "s" : ""} saved only in this browser. Add ${mine.length > 1 ? "them" : "it"} to your shared list?`),
      h("button", { class: "btn primary", type: "button", onclick: async () => {
        b.hidden = true; store.set("todo-imported", true);
        let order = minOrder();
        for (const t of mine) await api.addTask({ text: t.text.slice(0, 200), done: !!t.done, projectId: null, due: t.due || null, priority: t.priority || "normal", order: --order, createdAt: Date.now(), createdBy: S.me, doneAt: t.done ? Date.now() : null, doneBy: t.done ? S.me : null });
        toast(`Added ${mine.length} task${mine.length > 1 ? "s" : ""} to the shared list`);
      } }, "Add to shared list"),
      h("button", { class: "btn plain", type: "button", onclick: () => { b.hidden = true; store.set("todo-imported", true); } }, "Not now"),
    );
    b.hidden = false;
  }

  /* ---------- live presence ---------- */
  async function startRoom() {
    const t0 = Date.now();
    try {
      const me = await user.me();
      room.presence({ who: { c: me.color, t: t0 }, list: ui.project }).catch(() => {});
    } catch (e) {}
    room.onPeers(ch => { S.peers = ch.peers.filter(p => p.kind === "viewer"); render(); }, () => { S.peers = []; render(); });
  }
  const tellRoom = () => { if (room) room.presence({ list: ui.project }).catch(() => {}); };

  /* ---------- people ---------- */
  function needProfiles(ids) {
    if (!user) return;
    const missing = [...new Set(ids)].filter(id => id && !S.profiles.has(id));
    if (!missing.length) return;
    missing.forEach(id => S.profiles.set(id, null));
    user.profiles(missing).then(ps => { missing.forEach(id => S.profiles.set(id, ps[id] || null)); render(); });
  }
  const safeColor = c => typeof c === "string" && /^(#[0-9a-f]{3,8}|rgba?\([\d\s.,%]+\)|hsla?\([\d\s.,%deg]+\))$/i.test(c) ? c : null;
  function face(id, color, isMe) {
    const p = id ? S.profiles.get(id) : null;
    const name = isMe ? "You" : (p && p.name) || "Someone";
    if (p && p.avatarUrl) return h("img", { class: "face" + (isMe ? " me" : ""), src: p.avatarUrl, alt: name, title: name });
    const f = h("span", { class: "face" + (isMe ? " me" : ""), title: name, role: "img", "aria-label": name }, (name[0] || "?").toUpperCase());
    const c = safeColor(color); if (c) { f.style.background = c; f.style.color = "#fff"; }
    return f;
  }
  const personName = id => id === S.me ? "you" : ((S.profiles.get(id) || {}).name || "someone");

  /* ---------- quick-add parsing ---------- */
  const WD = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
  function parseInput(raw) {
    let text = " " + raw + " ", due = null, priority = null, projectId = null;
    text = text.replace(/\s(!high|!h|!urgent|!!+)(?=\s)/i, () => { priority = "high"; return " "; });
    text = text.replace(/\s(!low|!l)(?=\s)/i, () => { priority = "low"; return " "; });
    text = text.replace(/\s#([^\s#]+)(?=\s)/, (m, w) => {
      const key = w.toLowerCase();
      const p = [...S.projects.values()].find(p => p.name.toLowerCase().replace(/\s+/g, "").startsWith(key));
      if (!p) return m;
      projectId = p.id; return " ";
    });
    const dateRe = /\s(?:(due|by|on)\s+)?(today|tonight|tomorrow|tmrw?|next week|in (\d{1,2}) days?|(mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun)(?:day|sday|nesday|rsday|urday)?)(?=[\s.,!?])/i;
    text = text.replace(dateRe, (m, prep, word, n, wd) => {
      const w = word.toLowerCase();
      if (w === "today" || w === "tonight") due = addDays(0);
      else if (w.startsWith("tom") || w.startsWith("tmr")) due = addDays(1);
      else if (w === "next week") due = addDays(7);
      else if (n) due = addDays(+n);
      else {
        const full = WD.findIndex(d => d === w);
        if (full === -1 && !prep) return m;            // short day names only after "due/by/on"
        const idx = full !== -1 ? full : WD.findIndex(d => d.startsWith(wd.toLowerCase().slice(0, 3)));
        due = addDays((idx - new Date().getDay() + 7) % 7);
      }
      return " ";
    });
    return { text: text.replace(/\s+/g, " ").trim(), due, priority, projectId };
  }

  /* ---------- add form ---------- */
  const form = { due: null, priority: "normal", projectId: null, touched: { due: false, priority: false, project: false } };
  const input = $("#new-task"), dateInput = $("#date-input"), listSelect = $("#list-select");
  let lastParsed = {};
  function effective() {
    const p = parseInput(input.value);
    // A chip picked by hand wins over a typed shortcut.
    return {
      text: p.text,
      due: form.touched.due ? form.due : (p.due || form.due),
      priority: form.touched.priority ? form.priority : (p.priority || form.priority),
      projectId: form.touched.project ? form.projectId : (p.projectId || form.projectId),
      parsed: p,
    };
  }
  function renderForm() {
    const e = effective();
    $("#add-btn").disabled = !e.text;
    const cd = $("#chip-date"), cp = $("#chip-prio"), cl = $("#chip-list");
    cd.querySelector("span").textContent = e.due ? dueInfo(e.due).text : "No date";
    cd.classList.toggle("set", !!e.due);
    cp.querySelector("span").textContent = { high: "High priority", normal: "Normal", low: "Low priority" }[e.priority];
    cp.className = "chip" + (e.priority === "high" ? " high" : e.priority === "low" ? " low set" : "");
    const proj = e.projectId && S.projects.get(e.projectId);
    cl.querySelector("span").textContent = proj ? proj.name : "No list";
    cl.style.setProperty("--pc", proj ? `var(--c${proj.color % 6})` : "var(--muted)");
    cl.classList.toggle("set", !!proj);
    for (const [k, el] of [["due", cd], ["priority", cp], ["projectId", cl]]) {
      if (e.parsed[k] && e.parsed[k] !== lastParsed[k]) { el.classList.remove("parsed"); void el.offsetWidth; el.classList.add("parsed"); }
    }
    lastParsed = e.parsed;
    const opts = [h("option", { value: "" }, "No list"), ...sortedProjects().map(p => h("option", { value: p.id }, p.name))];
    listSelect.replaceChildren(...opts);
    listSelect.value = e.projectId || "";
  }
  function defaultFormProject() {
    if (!form.touched.project) form.projectId = ui.project !== "all" && S.projects.has(ui.project) ? ui.project : null;
  }
  input.addEventListener("input", renderForm);
  $("#chip-date").addEventListener("click", () => {
    dateInput.value = effective().due || "";
    try { dateInput.showPicker(); } catch (e) { dateInput.focus(); dateInput.click(); }
  });
  dateInput.addEventListener("change", () => { form.due = dateInput.value || null; form.touched.due = true; renderForm(); });
  $("#chip-prio").addEventListener("click", () => {
    const order = ["normal", "high", "low"];
    form.priority = order[(order.indexOf(effective().priority) + 1) % 3]; form.touched.priority = true; renderForm();
  });
  listSelect.addEventListener("change", () => { form.projectId = listSelect.value || null; form.touched.project = true; renderForm(); });
  $("#add-form").addEventListener("submit", async ev => {
    ev.preventDefault();
    if (S.readOnly) return;
    const e = effective();
    if (!e.text) return;
    await api.addTask({ text: e.text, done: false, projectId: e.projectId || null, due: e.due || null, priority: e.priority, order: minOrder() - 1, createdAt: Date.now(), createdBy: S.me, doneAt: null, doneBy: null });
    input.value = ""; form.due = null; form.priority = "normal"; form.touched = { due: false, priority: false, project: false };
    defaultFormProject(); renderForm(); input.focus();
  });
  const minOrder = () => Math.min(0, ...[...S.tasks.values()].map(t => t.order || 0));

  /* ---------- views ---------- */
  const sortedProjects = () => [...S.projects.values()].sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || (a.createdAt || 0) - (b.createdAt || 0));
  const inProject = t => ui.project === "all" || t.projectId === ui.project;
  function matches(t, f) {
    const n = t.due ? daysFromToday(t.due) : null;
    if (f === "today") return n !== null && n <= 0;
    if (f === "week") return n !== null && n <= 6;
    return true;
  }
  const prioRank = { high: 0, normal: 1, low: 2 };
  function smartCmp(a, b) {
    const ua = a.due && daysFromToday(a.due) <= 0 ? 0 : 1, ub = b.due && daysFromToday(b.due) <= 0 ? 0 : 1;
    return ua - ub || prioRank[a.priority || "normal"] - prioRank[b.priority || "normal"] || (a.due || "9999").localeCompare(b.due || "9999") || (a.order || 0) - (b.order || 0);
  }
  function view() {
    const scoped = [...S.tasks.values()].filter(inProject);
    const f = ui.filter === "done" ? "all" : ui.filter;
    const inF = scoped.filter(t => matches(t, f));
    let open = inF.filter(t => !t.done || S.completing.has(t.id));
    const done = inF.filter(t => t.done && !S.completing.has(t.id)).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    open.sort(ui.sort === "manual" ? (a, b) => (a.order || 0) - (b.order || 0) : smartCmp);
    if (ui.filter === "done") open = [];
    return { scoped, open, done, inF };
  }

  /* ---------- render ---------- */
  let raf = 0;
  function render() { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }
  function draw() {
    if (ui.project !== "all" && S.mode !== "loading" && S.confirmed && !S.projects.has(ui.project)) { ui.project = "all"; saveUI(); }
    drawHeader(); drawPanel(); drawTabs(); renderForm();
    $("#add-form").hidden = S.readOnly;
    $("#new-list-btn").hidden = S.readOnly;
    document.querySelectorAll(".sort button").forEach(b => b.setAttribute("aria-pressed", b.dataset.sort === ui.sort));
    if (!S.editing && !S.dragging) drawList();
    const ids = [...S.tasks.values()].flatMap(t => [t.createdBy, t.doneBy]).concat(S.peers.map(p => p.by));
    needProfiles(ids.filter(Boolean));
  }
  function drawHeader() {
    $("#today-label").textContent = new Date().toLocaleDateString("en-AU", { weekday: "long", day: "numeric", month: "long" });
    const st = $("#status");
    const map = {
      loading: ["", "Loading"], connecting: ["", "Connecting"],
      live: ["live", S.pending ? "Saving…" : "Live · synced"],
      slow: ["warn", "Can't reach the server yet"], error: ["warn", "Offline: changes may not save"],
      local: ["", "Saved on this device"],
    };
    const [cls, label] = map[S.status] || map.loading;
    st.className = "status " + cls;
    st.querySelector("span").textContent = S.readOnly && S.status === "live" ? "Live · view only" : label;
    const people = new Map();
    for (const p of S.peers) { const key = p.by || p.peer; if (!people.has(key) || p.isMe) people.set(key, p); }
    const list = [...people.values()].sort((a, b) => b.isMe - a.isMe);
    const shown = list.slice(0, 4).map(p => face(p.by, p.presence && p.presence.who && p.presence.who.c, p.isMe));
    if (list.length > 4) shown.push(h("span", { class: "face" }, "+" + (list.length - 4)));
    $("#faces").replaceChildren(...(list.length > 1 ? shown : []));
    $("#faces").title = list.length > 1 ? `${list.length} people here now` : "";
    $("#foot-note").textContent = S.mode === "cloud" ? "Shared list · changes appear for everyone instantly" : S.mode === "local" ? "Stored in this browser only" : "";
  }
  function drawPanel() {
    const { scoped } = view();
    const f = ui.filter === "done" ? "all" : ui.filter;
    const inF = scoped.filter(t => matches(t, f));
    const total = inF.length, done = inF.filter(t => t.done).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    $("#ring-bar").style.strokeDashoffset = String(226.2 * (1 - pct / 100));
    $("#ring-num").textContent = pct + "%";
    const open = scoped.filter(t => !t.done);
    const overdue = open.filter(t => t.due && daysFromToday(t.due) < 0).length;
    const today = open.filter(t => t.due && daysFromToday(t.due) === 0).length;
    const line = $("#summary-line");
    if (S.mode === "loading" || (S.mode === "cloud" && !S.confirmed && !S.tasks.size)) line.textContent = "Loading your tasks…";
    else if (!open.length) line.textContent = scoped.length ? "Everything's done. Nice work." : "A clean slate. Add your first task below.";
    else {
      const parts = [];
      if (overdue) parts.push(h("span", { class: "od" }, `${overdue} overdue`));
      if (today) parts.push(h("span", { class: "td" }, `${today} due today`));
      parts.push(`${open.length} open`);
      line.replaceChildren(...parts.flatMap((p, i) => i ? [" · ", p] : [p]));
    }
    const counts = {
      all: open.length,
      today: open.filter(t => matches(t, "today")).length,
      week: open.filter(t => matches(t, "week")).length,
      done: scoped.filter(t => t.done).length,
    };
    const labels = { all: "All", today: "Today", week: "This week", done: "Completed" };
    $("#filters").replaceChildren(...Object.keys(labels).map(k =>
      h("button", { type: "button", "aria-pressed": String(ui.filter === k), onclick: () => { ui.filter = k; saveUI(); render(); } },
        labels[k], counts[k] ? h("span", { class: "n" + (k === "today" && overdue ? " hot" : "") }, counts[k]) : null)));
  }
  function drawTabs() {
    const openCount = pid => [...S.tasks.values()].filter(t => !t.done && (pid === "all" || t.projectId === pid)).length;
    const here = pid => S.peers.filter(p => !p.isMe && p.presence && p.presence.list === pid);
    const mk = (pid, name, color) => {
      const active = ui.project === pid;
      const others = here(pid);
      const tab = h("button", { class: "tab", type: "button", "aria-pressed": String(active), onclick: e => {
        if (e.target.closest(".more")) return;
        ui.project = pid; saveUI(); form.touched.project = false; defaultFormProject(); tellRoom(); render();
      } },
        pid !== "all" ? h("i", { class: "sw" }) : null,
        name,
        h("span", { class: "cnt" }, openCount(pid) || ""),
        others.length ? h("span", { class: "here", title: others.map(p => personName(p.by)).join(", ") + " looking here" },
          ...others.slice(0, 3).map(p => { const i = h("i"); i.style.background = safeColor(p.presence.who && p.presence.who.c) || "var(--accent)"; return i; })) : null,
        active && pid !== "all" && !S.readOnly ? h("span", { class: "more", role: "button", tabindex: "0", "aria-label": "List options", svg: ICON.more, onclick: e => openListMenu(e.currentTarget, pid), onkeydown: e => { if (e.key === "Enter") openListMenu(e.currentTarget, pid); } }) : null,
      );
      if (color != null) tab.style.setProperty("--pc", `var(--c${color % 6})`);
      return tab;
    };
    $("#tabs").replaceChildren(mk("all", "All lists"), ...sortedProjects().map(p => mk(p.id, p.name, p.color)));
  }

  function drawList() {
    const area = $("#list-area");
    if (S.mode === "loading" || (S.mode === "cloud" && !S.confirmed && !S.tasks.size)) {
      if (S.status === "slow" || S.status === "error") area.replaceChildren(emptyState("Can't reach your shared list", "Check your connection. Your tasks will appear as soon as it's back."));
      return;
    }
    const { open, done } = view();
    const n = open.filter(t => !S.completing.has(t.id)).length;
    $("#toolbar-count").textContent = ui.filter === "done" ? `${done.length} completed` : `${n} open${done.length ? ` · ${done.length} done` : ""}`;
    const kids = [];
    if (open.length) {
      const ul = h("ul", { class: "tasks", id: "open-list" }, ...open.map(t => row(t)));
      kids.push(ul);
      if (ui.sort === "manual" && !S.readOnly && window.Sortable) makeSortable(ul);
    } else if (ui.filter !== "done") {
      const msgs = {
        all: S.tasks.size ? ["All clear", "Every task in this list is done."] : ["Nothing here yet", "Type a task above and press Enter."],
        today: ["Nothing due today", "Enjoy the breathing room, or pull something forward."],
        week: ["A quiet week ahead", "No open tasks are due in the next 7 days."],
      };
      kids.push(emptyState(...msgs[ui.filter]));
    }
    if (done.length) {
      const expanded = ui.filter === "done" || ui.showDone;
      if (ui.filter !== "done") kids.push(h("button", { class: "done-head", type: "button", "aria-expanded": String(expanded), onclick: e => {
        if (e.target.closest(".clear")) return;
        ui.showDone = !ui.showDone; saveUI(); render();
      } }, h("span", { svg: ICON.chev }), `Completed · ${done.length}`,
        !S.readOnly ? h("span", { class: "clear", role: "button", tabindex: "0", onclick: () => clearDone(done), onkeydown: e => { if (e.key === "Enter") clearDone(done); } }, "Clear all") : null));
      if (expanded) kids.push(h("ul", { class: "tasks done-list" }, ...done.map(t => row(t))));
    } else if (ui.filter === "done") kids.push(emptyState("No completed tasks yet", "Tick something off and it will show up here."));
    area.replaceChildren(...kids);
  }
  function emptyState(title, sub) {
    return h("div", { class: "empty" }, h("div", { class: "art", svg: ICON.sun }), h("b", null, title), h("span", null, sub));
  }

  function row(t) {
    const prio = t.priority || "normal";
    const isDone = t.done && !S.completing.has(t.id);
    const li = h("li", { class: `task prio-${prio}${isDone ? " done" : ""}${S.completing.has(t.id) ? " completing" : ""}${S.flash.has(t.id) ? " flash" : ""}`, "data-id": t.id });
    if (ui.sort === "manual" && !t.done && !S.readOnly) li.append(h("span", { class: "grip", "aria-hidden": "true", svg: ICON.grip }));
    li.append(h("button", { class: "check", type: "button", role: "checkbox", "aria-checked": String(!!t.done), "aria-label": (t.done ? "Mark not done: " : "Mark done: ") + t.text, disabled: S.readOnly, svg: ICON.check, onclick: e => toggle(t, e.currentTarget) }));

    const text = h("div", { class: "text", ondblclick: () => startEdit(t, text) }, h("span", null, t.text));
    const meta = h("div", { class: "meta" });
    if (t.due && !isDone) {
      const d = dueInfo(t.due);
      meta.append(dateTag(t, h("span", { svg: ICON.cal }), d.text, "tag " + d.cls));
    } else if (!t.done && !S.readOnly) {
      meta.append(dateTag(t, h("span", { svg: ICON.cal }), "Add date", "tag ghost"));
    }
    const proj = t.projectId && S.projects.get(t.projectId);
    if (proj && ui.project === "all") {
      const tg = h("span", { class: "tag proj" }, h("i", { class: "sw" }), proj.name);
      tg.style.setProperty("--pc", `var(--c${proj.color % 6})`);
      meta.append(tg);
    }
    if (S.mode === "cloud") {
      const by = t.done ? t.doneBy : t.createdBy;
      if (by) meta.append(h("span", { class: "who" }, face(by, null, false), t.done ? `Done by ${personName(by)}` : `Added by ${personName(by)}`));
    }
    li.append(h("div", { class: "body" }, text, meta));

    if (!S.readOnly) li.append(h("div", { class: "actions" },
      !t.done ? h("button", { class: "icon-btn flag" + (prio === "high" ? " on" : ""), type: "button", title: "Priority: " + prio + " (click to change)", "aria-label": "Change priority, now " + prio, svg: ICON.flag, onclick: () => {
        const next = { normal: "high", high: "low", low: "normal" }[prio];
        api.updateTask(t.id, { priority: next });
        toast(`Priority set to ${next}`);
      } }) : null,
      h("button", { class: "icon-btn del", type: "button", "aria-label": "Delete: " + t.text, svg: ICON.x, onclick: () => del(t) })));
    return li;
  }
  function dateTag(t, icon, label, cls) {
    if (S.readOnly) return h("span", { class: cls }, icon, label);
    const di = h("input", { type: "date", class: "date-proxy", tabindex: "-1", "aria-label": "Due date" });
    di.value = t.due || "";
    di.addEventListener("change", () => { api.updateTask(t.id, { due: di.value || null }); });
    const b = h("button", { class: cls, type: "button", title: "Change due date", onclick: () => { try { di.showPicker(); } catch (e) { di.focus(); di.click(); } } }, icon, label, di);
    return b;
  }

  /* ---------- actions ---------- */
  function toggle(t, btn) {
    if (S.readOnly || S.completing.has(t.id)) return;
    if (t.done) { api.updateTask(t.id, { done: false, doneAt: null, doneBy: null }); return; }
    const before = view().open.filter(x => !x.done).length;
    S.completing.add(t.id);
    const li = btn.closest("li"); li.classList.add("completing");
    const r = btn.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 22, 5);
    setTimeout(() => {
      S.completing.delete(t.id);
      api.updateTask(t.id, { done: true, doneAt: Date.now(), doneBy: S.me });
      if (before === 1) celebrate();
    }, 520);
  }
  function del(t) {
    const copy = { ...t }; delete copy.id;
    api.removeTask(t.id);
    toast("Task deleted", () => api.restoreTask(t.id, copy));
  }
  function clearDone(list) {
    const copies = list.map(t => { const c = { ...t }; delete c.id; return [t.id, c]; });
    copies.forEach(([id]) => api.removeTask(id));
    toast(`Cleared ${copies.length} completed`, () => copies.forEach(([id, c]) => api.restoreTask(id, c)));
  }
  function startEdit(t, el) {
    if (S.readOnly) return;
    S.editing = t.id;
    const inp = h("input", { class: "edit-input", maxlength: "200", "aria-label": "Edit task" });
    inp.value = t.text;
    let finished = false;
    const finish = save => {
      if (finished) return; finished = true;
      const v = inp.value.trim();
      S.editing = null;
      if (save && v && v !== t.text) api.updateTask(t.id, { text: v });
      render();
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); });
    inp.addEventListener("blur", () => finish(true));
    el.replaceChildren(inp); inp.focus(); inp.select();
  }

  function makeSortable(ul) {
    new Sortable(ul, {
      handle: ".grip", animation: 160, ghostClass: "sortable-ghost", chosenClass: "sortable-chosen",
      onStart: () => { S.dragging = true; },
      onEnd: ev => {
        S.dragging = false;
        const ids = [...ul.children].map(li => li.dataset.id);
        const id = ev.item.dataset.id, i = ids.indexOf(id);
        const prev = S.tasks.get(ids[i - 1]), next = S.tasks.get(ids[i + 1]);
        let order;
        if (prev && next) order = ((prev.order || 0) + (next.order || 0)) / 2;
        else if (prev) order = (prev.order || 0) + 1;
        else if (next) order = (next.order || 0) - 1;
        else order = 0;
        if (ev.oldIndex !== ev.newIndex) api.updateTask(id, { order });
        render();
      },
    });
  }

  /* ---------- list menu (rename, colour, delete) ---------- */
  let pop = null;
  function closePop() { if (pop) { pop.remove(); pop = null; } }
  document.addEventListener("pointerdown", e => { if (pop && !pop.contains(e.target) && !e.target.closest(".more")) closePop(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });
  function openListMenu(anchor, pid) {
    closePop();
    const p = S.projects.get(pid); if (!p) return;
    pop = h("div", { class: "popover", role: "dialog", "aria-label": "List options" });
    const nameIn = h("input", { maxlength: "40", "aria-label": "List name" }); nameIn.value = p.name;
    const saveName = () => { const v = nameIn.value.trim(); if (v && v !== p.name) api.updateProject(pid, { name: v }); };
    nameIn.addEventListener("keydown", e => { if (e.key === "Enter") { saveName(); closePop(); } });
    nameIn.addEventListener("change", saveName);
    const sw = h("div", { class: "swatches" }, ...[0, 1, 2, 3, 4, 5].map(i => {
      const b = h("button", { type: "button", "aria-label": "Colour " + (i + 1), "aria-pressed": String(p.color % 6 === i), onclick: () => { api.updateProject(pid, { color: i }); closePop(); } });
      b.style.setProperty("--pc", `var(--c${i})`); return b;
    }));
    const delBtn = h("button", { class: "item danger", type: "button", onclick: () => {
      const n = [...S.tasks.values()].filter(t => t.projectId === pid).length;
      pop.replaceChildren(h("div", { class: "confirm" },
        h("span", null, `Delete "${p.name}"?`, n ? ` Its ${n} task${n > 1 ? "s" : ""} will stay in All lists.` : ""),
        h("div", { class: "row" },
          h("button", { class: "btn danger", type: "button", onclick: () => {
            [...S.tasks.values()].filter(t => t.projectId === pid).forEach(t => api.updateTask(t.id, { projectId: null }));
            api.removeProject(pid); ui.project = "all"; saveUI(); tellRoom(); closePop(); toast(`Deleted "${p.name}"`);
          } }, "Delete list"),
          h("button", { class: "btn plain", type: "button", onclick: closePop }, "Cancel"))));
    } }, "Delete list…");
    pop.append(h("div", { class: "confirm" }, nameIn), sw, delBtn);
    document.body.append(pop);
    const r = anchor.getBoundingClientRect();
    const w = pop.offsetWidth;
    pop.style.left = Math.max(16, Math.min(r.left - 10, innerWidth - w - 16)) + "px";
    pop.style.top = (r.bottom + 8) + "px";
    nameIn.focus(); nameIn.select();
  }

  /* ---------- new list ---------- */
  const nlBtn = $("#new-list-btn"), nlIn = $("#new-list-input");
  nlBtn.addEventListener("click", () => { nlBtn.hidden = true; nlIn.hidden = false; nlIn.value = ""; nlIn.focus(); });
  function endNewList(save) {
    const v = nlIn.value.trim();
    nlIn.hidden = true; nlBtn.hidden = S.readOnly;
    if (save && v) {
      const used = sortedProjects().map(p => p.color % 6);
      const color = [0, 1, 2, 3, 4, 5].find(c => !used.includes(c)) ?? S.projects.size % 6;
      const id = api.addProject({ name: v, color, order: S.projects.size, createdAt: Date.now(), createdBy: S.me });
      ui.project = id; saveUI(); form.touched.project = false; form.projectId = id; tellRoom(); render();
    }
  }
  nlIn.addEventListener("keydown", e => { if (e.key === "Enter") endNewList(true); if (e.key === "Escape") endNewList(false); });
  nlIn.addEventListener("blur", () => endNewList(true));

  document.querySelectorAll(".sort button").forEach(b => b.addEventListener("click", () => { ui.sort = b.dataset.sort; saveUI(); render(); }));
  document.addEventListener("keydown", e => {
    if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); input.focus(); }
  });

  /* ---------- toast with undo ---------- */
  let toastTimer = 0;
  function toast(msg, onUndo) {
    const t = $("#toast"), b = $("#toast-btn");
    $("#toast-text").textContent = msg;
    b.hidden = !onUndo;
    b.onclick = () => { if (onUndo) onUndo(); t.classList.remove("show"); };
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), onUndo ? 6000 : 2400);
  }

  /* ---------- confetti ---------- */
  const cv = $("#fx"), cx = cv.getContext("2d");
  let parts = [], fxRaf = 0;
  function sizeFx() { const d = devicePixelRatio || 1; cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0); }
  addEventListener("resize", sizeFx); sizeFx();
  function palette() { const cs = getComputedStyle(document.documentElement); return [0, 1, 2, 3, 4, 5].map(i => cs.getPropertyValue("--c" + i).trim() || "#1f6f5c"); }
  function burst(x, y, n, power) {
    if (reduced) return;
    const cols = palette();
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = power * (0.4 + Math.random());
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - power * 0.6, life: 1, s: 3 + Math.random() * 4, c: cols[i % cols.length], rot: Math.random() * 6, vr: (Math.random() - .5) * .4, round: i % 3 === 0 });
    }
    if (!fxRaf) fxRaf = requestAnimationFrame(tick);
  }
  function tick() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 20);
    for (const p of parts) {
      p.vy += 0.22; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 0.012;
      cx.save(); cx.globalAlpha = Math.min(1, p.life * 2); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c;
      if (p.round) { cx.beginPath(); cx.arc(0, 0, p.s / 2, 0, Math.PI * 2); cx.fill(); } else cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      cx.restore();
    }
    fxRaf = parts.length ? requestAnimationFrame(tick) : 0;
    if (!fxRaf) cx.clearRect(0, 0, innerWidth, innerHeight);
  }
  function celebrate() {
    if (reduced) { toast("All done. Nice work."); return; }
    for (let i = 0; i < 6; i++) setTimeout(() => burst(innerWidth * (0.15 + Math.random() * 0.7), innerHeight * 0.25, 40, 9), i * 120);
    toast("All done. Nice work.");
  }

  /* ---------- boot ---------- */
  draw();
  if (!window.claude || typeof window.claude.use !== "function") startLocal();
  else {
    S.status = "connecting"; drawHeader();
    Promise.all([claude.use("db"), claude.use("user"), claude.use("room")]).then(([d, u, r]) => {
      db = d; user = u; room = r;
      if (!db) { startLocal(); return; }
      startCloud();
      if (room && user) startRoom();
    }, startLocal);
  }
  defaultFormProject(); renderForm();
})();
</script>
