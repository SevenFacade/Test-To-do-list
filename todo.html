<title>Today's List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* Layout: single centred column, one card holding input + list */
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --fg: #17202b;
    --muted: #6b7684;
    --line: #dde3ea;
    --accent: #1f6f5c;
    --accent-soft: #e2f0eb;
    --danger: #c2412d;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11161c; --surface: #1a2129; --fg: #e8edf2; --muted: #8b97a5;
      --line: #2a333d; --accent: #5cc5a6; --accent-soft: #1d3530; --danger: #f07a66;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161c; --surface: #1a2129; --fg: #e8edf2; --muted: #8b97a5;
    --line: #2a333d; --accent: #5cc5a6; --accent-soft: #1d3530; --danger: #f07a66;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 16px; line-height: 1.5;
    padding-inline: 16px; padding-block: 48px 64px;
  }
  .wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 20px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.25rem; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
  .count { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }

  form { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
  #new-task {
    flex: 1; min-width: 0; font: inherit; color: var(--fg); background: transparent;
    border: 1px solid transparent; border-radius: 10px; padding: 10px 12px;
  }
  #new-task::placeholder { color: var(--muted); }
  #new-task:focus { outline: none; border-color: var(--accent); }
  .add {
    font: inherit; font-weight: 600; color: var(--surface); background: var(--accent);
    border: 0; border-radius: 10px; padding: 0 18px; cursor: pointer;
  }
  .add:hover { filter: brightness(1.08); }
  .add:focus-visible, button:focus-visible, input[type=checkbox]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li:hover .del { opacity: 1; }

  input[type=checkbox] {
    appearance: none; flex: none; width: 22px; height: 22px; margin: 0;
    border: 2px solid var(--line); border-radius: 50%; cursor: pointer;
    display: grid; place-content: center; transition: background .15s, border-color .15s;
  }
  input[type=checkbox]:hover { border-color: var(--accent); }
  input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
  input[type=checkbox]:checked::after {
    content: ""; width: 6px; height: 11px; margin-top: -2px;
    border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }

  .text { flex: 1; min-width: 0; overflow-wrap: anywhere; transition: color .15s; }
  li.done .text { color: var(--muted); text-decoration: line-through; }

  .del {
    flex: none; width: 32px; height: 32px; border: 0; border-radius: 8px; cursor: pointer;
    background: transparent; color: var(--muted); opacity: .45; display: grid; place-content: center;
    transition: opacity .15s, color .15s, background .15s;
  }
  .del:hover { color: var(--danger); background: var(--accent-soft); opacity: 1; }
  .del:focus-visible { opacity: 1; }

  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }

  footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 0.875rem; }
  .clear { font: inherit; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 4px 0; }
  .clear:hover { color: var(--danger); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>Today's List</h1>
    <span class="count" id="count"></span>
  </header>

  <div class="card">
    <form id="add-form" autocomplete="off">
      <label for="new-task" hidden>New task</label>
      <input id="new-task" type="text" placeholder="Add a task and press Enter" maxlength="200">
      <button class="add" type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <div class="empty" id="empty" hidden>Nothing to do. Add your first task above.</div>
  </div>

  <footer id="footer">
    <span>Saved in this browser</span>
    <button class="clear" id="clear-done" type="button">Clear completed</button>
  </footer>
</div>

<script>
  const KEY = "todo-list-v1";
  const examples = [
    { id: 1, text: "Example: Reply to supplier quote", done: false },
    { id: 2, text: "Example: Book site inspection for Friday", done: false },
    { id: 3, text: "Example: Send invoice to client", done: true },
  ];

  let tasks;
  try { tasks = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!Array.isArray(tasks)) tasks = examples;

  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  const count = document.getElementById("count");
  const footer = document.getElementById("footer");
  const input = document.getElementById("new-task");

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
  }

  function render() {
    list.innerHTML = "";
    for (const t of tasks) {
      const li = document.createElement("li");
      li.className = t.done ? "done" : "";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = t.done;
      cb.setAttribute("aria-label", "Mark complete: " + t.text);
      cb.addEventListener("change", () => { t.done = cb.checked; save(); render(); });

      const span = document.createElement("span");
      span.className = "text";
      span.textContent = t.text;

      const del = document.createElement("button");
      del.className = "del";
      del.type = "button";
      del.setAttribute("aria-label", "Delete: " + t.text);
      del.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
      del.addEventListener("click", () => { tasks = tasks.filter(x => x !== t); save(); render(); });

      li.append(cb, span, del);
      list.append(li);
    }
    const left = tasks.filter(t => !t.done).length;
    const done = tasks.length - left;
    empty.hidden = tasks.length > 0;
    count.textContent = tasks.length ? `${left} to do · ${done} done` : "";
    footer.hidden = tasks.length === 0;
    document.getElementById("clear-done").hidden = done === 0;
  }

  document.getElementById("add-form").addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    tasks.push({ id: Date.now(), text, done: false });
    input.value = "";
    save(); render();
    input.focus();
  });

  document.getElementById("clear-done").addEventListener("click", () => {
    tasks = tasks.filter(t => !t.done); save(); render();
  });

  render();
</script>
